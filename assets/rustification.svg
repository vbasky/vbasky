<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img">
  <title>Rustification</title>
  <defs>
    <clipPath id="card">
      <rect width="860" height="200" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="860" height="200" fill="#141210"/>
    <rect width="8" height="200" fill="#F74C00"/>
    <text x="48" y="64" fill="#F74C00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="5">RUSTIFICATION</text>
    <text x="48" y="118" fill="#f4efe8" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="36">From the tool you run</text>
    <text x="48" y="164" fill="#F74C00" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="36">to the one you compile.</text>
  </g>
</svg>
