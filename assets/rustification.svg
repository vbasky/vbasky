<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="248" viewBox="0 0 1000 248" role="img">
  <title>Rustification</title>
  <defs>
    <clipPath id="card">
      <rect width="1000" height="248" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="248" fill="#141210"/>
    <rect width="8" height="248" fill="#F74C00"/>
    <text x="56" y="78" fill="#F74C00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="5">RUSTIFICATION</text>
    <text x="56" y="132" fill="#f4efe8" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="40">From the tool you run</text>
    <text x="56" y="182" fill="#F74C00" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="40">to the one you compile.</text>
    <text x="600" y="108" fill="#a39e96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">MediaInfoLib</text>
    <text x="752" y="108" fill="#F74C00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">→</text>
    <text x="784" y="108" fill="#f4efe8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">revelo</text>
    <text x="600" y="140" fill="#a39e96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Shaka Packager</text>
    <text x="752" y="140" fill="#F74C00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">→</text>
    <text x="784" y="140" fill="#f4efe8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">sheathe</text>
    <text x="600" y="172" fill="#a39e96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">ffmpeg</text>
    <text x="752" y="172" fill="#F74C00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">→</text>
    <text x="784" y="172" fill="#f4efe8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">cathar</text>
  </g>
</svg>
