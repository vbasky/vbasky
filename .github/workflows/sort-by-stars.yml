name: Sort featured projects by stars

on:
  schedule:
    # 21:00 UTC is 08:00 in Sydney during daylight saving.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sort-profile-stars
  cancel-in-progress: false

jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the sorter
        working-directory: scripts
        run: python -m unittest test_sort_profile_by_stars.py

      - name: Reorder each section by GitHub stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sort_profile_by_stars.py

      - name: Commit the new order
        run: |
          if git diff --quiet -- README.md; then
            echo "Order unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Sort featured projects by GitHub stars."
          git push
